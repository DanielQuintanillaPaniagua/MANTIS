
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis-api-security"
version = "0.1.0"
description = "Modular framework for authorized API security testing"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
lab = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
