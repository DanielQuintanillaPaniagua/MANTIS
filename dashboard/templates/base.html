<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANTIS :: {% block title %}Mission Control{% endblock %}</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/mantis.css' %}">
</head>

<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <aside class="mantis-sidebar">
            <div class="sidebar-header">
                <i class="bi bi-shield-lock-fill text-success fs-3"></i>
                <div>
                    <div class="mantis-brand">MANTIS</div>
                    <div class="mantis-subtitle">Mission Control</div>
                </div>
            </div>

            <nav class="sidebar-nav mt-4">
                <a href="{% url 'core:home' %}"
                    class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <i class="bi bi-grid-1x2-fill"></i> Dashboard
                </a>
                <a href="{% url 'scans:list' %}"
                    class="nav-item {% if request.resolver_match.url_name == 'list' %}active{% endif %}">
                    <i class="bi bi-radar"></i> Scans
                </a>
                <a href="{% url 'scans:finding_list' %}"
                    class="nav-item {% if 'finding' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-exclamation-triangle-fill"></i> Findings
                </a>
                <a href="{% url 'reports:list' %}"
                    class="nav-item {% if 'report' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-file-earmark-bar-graph-fill"></i> Reports
                </a>
                <a href="{% url 'targets:list' %}"
                    class="nav-item {% if 'target' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-crosshair"></i> Targets
                </a>
            </nav>

            <div class="sidebar-footer mt-auto">
                <div class="status-dot"></div> System Online<br>
                <small class="text-muted">v0.1.0 (MK-008)</small>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="mantis-content w-100">
            <!-- Topbar -->
            <header class="mantis-topbar d-flex justify-content-between align-items-center">
                <div class="search-bar">
                    <i class="bi bi-search me-2 text-muted"></i>
                    <input type="text" placeholder="Search scans, findings..." disabled>
                </div>
                <div class="user-profile d-flex align-items-center">
                    <i class="bi bi-bell-fill text-muted me-4"></i>
                    <i class="bi bi-person-circle fs-4 text-success"></i>
                    <span class="ms-2 font-monospace text-light">Operator</span>
                </div>
            </header>

            <main class="p-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
