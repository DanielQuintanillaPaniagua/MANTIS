<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANTIS :: {% block title %}Mission Control{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/mantis.css' %}">
</head>

<body>
    <nav class="navbar navbar-expand-lg mantis-navbar">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'core:home' %}">
                <i class="bi bi-bug-fill me-2"></i>
                <span class="mantis-brand">MANTIS</span>
                <span class="mantis-subtitle ms-2">Mission Control</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'core:home' %}">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'scans:list' %}">
                            <i class="bi bi-radar me-1"></i>Scans
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'scans:finding_list' %}">
                            <i class="bi bi-exclamation-triangle me-1"></i>Findings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" title="Coming soon">
                            <i class="bi bi-file-earmark-text me-1"></i>Reports
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" title="Coming soon">
                            <i class="bi bi-crosshair me-1"></i>Targets
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid mantis-main py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="mantis-footer text-center py-3">
        <small>MANTIS — Modular API Network Testing & Inspection System</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>

</html>
