{% extends "base.html" %}

{% block title %}New Scan{% endblock %}

{% block content %}
<h1 class="mantis-page-title mb-4"><i class="bi bi-plus-circle me-2"></i>New Scan</h1>

<form method="post" class="mantis-form">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
        <div class="form-text text-muted">{{ field.help_text }}</div>
        {% endif %}
        {% if field.errors %}
        <div class="text-danger">{{ field.errors }}</div>
        {% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-mantis">
        <i class="bi bi-play-fill me-1"></i>Run Scan
    </button>
    <a href="{% url 'scans:list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
