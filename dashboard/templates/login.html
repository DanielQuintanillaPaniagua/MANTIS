<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>MANTIS :: Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/mantis.css' %}">
</head>

<body class="d-flex align-items-center justify-content-center" style="height: 100vh; background: var(--mc-bg);">
    <div class="mantis-card p-5" style="width: 400px;">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-success fs-1"></i>
            <h2 class="mantis-brand mt-2">MANTIS</h2>
            <p class="text-muted font-monospace small">RESTRICTED ACCESS</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger p-2 small">Invalid credentials.</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="mantis-form">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-muted small">OPERATOR ID</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">PASSPHRASE</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-mantis w-100">AUTHENTICATE</button>
        </form>
    </div>
</body>

</html>
